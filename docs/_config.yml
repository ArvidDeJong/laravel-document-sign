title: darvis/laravel-document-sign
description: Sign PDF documents in Laravel with a DocuSign like flow. Invite signers by mail, capture a drawn signature on a signing page, stamp it on the PDF and keep a full audit trail, with an optional portal.
url: https://arviddejong.github.io
baseurl: /laravel-document-sign

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# docs/README.md is the index for browsing on GitHub; the site has its own index.md.
exclude:
  - README.md

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/laravel-document-sign
  repository: https://github.com/ArvidDeJong/laravel-document-sign
  packagist: https://packagist.org/packages/darvis/laravel-document-sign
  license_url: https://github.com/ArvidDeJong/laravel-document-sign/blob/main/LICENSE
  requires: PHP 8.2+, Laravel 11, 12 or 13, and the GD extension
  platforms: [Laravel]
  keywords: [laravel, pdf, signature, e-signature, document signing, docusign alternative, audit trail]

# Developer credit in the footer and the structured data.
developer:
  company: ARVID.NL
  url: https://arvid.nl

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/ArvidDeJong/laravel-document-sign
  Packagist: https://packagist.org/packages/darvis/laravel-document-sign
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ArvidDeJong/laravel-document-sign
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
